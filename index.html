<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>avaryholding 云学堂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#f5f6fa;font-family:'PingFang SC','Microsoft YaHei',sans-serif;display:flex;flex-direction:column;color:#262626}
header{height:64px;background:#008aff;display:flex;align-items:center;padding:0 32px;flex-shrink:0}
header span{color:#fff;font-size:15px;font-weight:500;letter-spacing:0.5px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:40px}
.avatar-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:32px}
.avatar-circle{width:64px;height:64px;border-radius:50%;background:#e6f4ff;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.avatar-circle svg{width:32px;height:32px;stroke:#008aff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:20px;font-weight:600;color:#262626;margin-bottom:4px}
.subtitle{font-size:14px;color:#8c8c8c}
.form-group{margin-bottom:20px}
label{display:block;font-size:14px;color:#262626;font-weight:500;margin-bottom:8px}
input{width:100%;height:40px;padding:0 12px;font-size:14px;color:#262626;background:#fff;border:1px solid #d9d9d9;border-radius:4px;outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#bfbfbf}
input:focus{border-color:#0089ff;box-shadow:0 0 0 2px rgba(0,137,255,0.1)}
.btn-login{width:100%;height:40px;border:none;border-radius:4px;background:#008aff;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s,transform .1s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-login:hover{background:#0070e0}
.btn-login:active{transform:scale(0.98)}
.btn-login:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.spinner{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.btn-login.loading .spinner{display:inline-block}
.btn-login.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.forgot{background:none;border:none;font-size:12px;color:#8c8c8c;cursor:pointer;transition:color .2s}
.forgot:hover{color:#008aff}
.copyright{font-size:12px;color:#8c8c8c;user-select:none}
</style>
</head>
<body>
<header><span>avaryholding</span></header>
<main>
  <div class="login-card">
    <div class="avatar-wrap">
      <div class="avatar-circle">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <h1>欢迎登录</h1>
      <p class="subtitle">请输入您的账号和密码</p>
    </div>
    <div class="form-group">
      <label for="account">账号</label>
      <input id="account" type="text" placeholder="手机号/邮箱">
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input id="password" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn-login" id="loginBtn" onclick="login()">
      <span class="spinner"></span>
      <span class="btn-text">登 录</span>
    </button>
    <div class="footer">
      <button class="forgot">忘记密码？</button>
      <p class="copyright">&copy; avaryholding 云学堂</p>
    </div>
  </div>
</main>
<script>
function login(){
  var btn=document.getElementById('loginBtn');
  var acc=document.getElementById('account').value.trim();
  var pwd=document.getElementById('password').value.trim();
  if(!acc||!pwd)return;
  btn.disabled=true;
  btn.classList.add('loading');
  setTimeout(function(){
    btn.disabled=false;
    btn.classList.remove('loading');
    alert('登录功能仅做演示');
  },800);
}
</script>
</body>
</html>
